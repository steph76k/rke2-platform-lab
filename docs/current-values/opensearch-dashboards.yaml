# INVENTORY ONLY – redacted; never deploy this file.
config:
  opensearch_dashboards.yml: 'server.host: 0.0.0.0

    opensearch.hosts:

    - https://opensearch-cluster-master:9200

    opensearch.ssl.verificationMode: none

    opensearch.username: kibanaserver

    opensearch.password: <REDACTED>

    opensearch.requestHeadersWhitelist:

    - authorization

    - securitytenant

    opensearch_security.multitenancy.enabled: true

    opensearch_security.multitenancy.tenants.preferred:

    - Private

    - Global

    opensearch_security.readonly_mode.roles:

    - kibana_read_only

    opensearch_security.cookie.secure: false

    data_source.enabled: false

    workspace.enabled: false

    explore.enabled: false

    '
ingress:
  enabled: true
  hosts:
  - host: opensearch.berger.ph
    paths:
    - backend:
        serviceName: ''
        servicePort: ''
      path: /
  ingressClassName: cilium
  tls: []
opensearchHosts: https://opensearch-cluster-master:9200
replicaCount: 1
resources:
  limits:
    cpu: 500m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi
service:
  port: 5601
  type: ClusterIP
