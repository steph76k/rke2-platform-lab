# INVENTORY ONLY – redacted; never deploy this file.
antiAffinity: soft
antiAffinityTopologyKey: kubernetes.io/hostname
clusterName: opensearch-cluster
config:
  opensearch.yml: 'cluster.name: opensearch-cluster

    network.host: 0.0.0.0'
extraEnvs:
- name: OPENSEARCH_INITIAL_ADMIN_PASSWORD
  value: <REDACTED>
nodeGroup: master
persistence:
  accessModes:
  - ReadWriteOnce
  enabled: true
  size: 10Gi
  storageClass: longhorn
replicas: 3
resources:
  limits:
    cpu: '2'
    memory: 2Gi
  requests:
    cpu: 250m
    memory: 1Gi
roles:
- master
- ingest
- data
- remote_cluster_client
service:
  type: ClusterIP
