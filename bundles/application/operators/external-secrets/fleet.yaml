  repo: https://charts.external-secrets.io
  chart: external-secrets
  version: 2.11.0
  valuesFiles:
    - values.yaml
overrideTargets:
  - name: lab-applications
    clusterSelector:
      matchLabels:
        environment: lab
        role: applications
