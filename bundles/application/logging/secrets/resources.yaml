apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-logging
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-app-logging-tokenreview
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-app-logging-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-app-logging-tokenreview
subjects:
- kind: ServiceAccount
  name: openbao-logging
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-logging
spec:
  conditions:
  - namespaces:
    - cattle-logging-system
  provider:
    vault:
      server: https://openbao.berger.ph
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: rke2-cluster1
          role: eso-logging
          serviceAccountRef:
            name: openbao-logging
            namespace: external-secrets
            audiences:
            - https://kubernetes.default.svc.cluster.local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-logging
  namespace: cattle-logging-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-logging
  target:
    name: platform-opensearch-logging
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: platform/opensearch/logging
      property: username
  - secretKey: password
    remoteRef:
      key: platform/opensearch/logging
      property: password
  - secretKey: ca.crt
    remoteRef:
      key: platform/opensearch/logging
      property: ca.crt
