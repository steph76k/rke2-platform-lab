name: lab-app-logging-operator
defaultNamespace: cattle-logging-system
helm:
  releaseName: rancher-logging
  repo: https://charts.rancher.io
  chart: rancher-logging
  version: 109.0.1+up4.10.0-rancher.24
  valuesFiles:
  - values.yaml
  timeoutSeconds: 900
overrideTargets:
- name: lab-applications
  clusterSelector:
    matchLabels:
      environment: lab
      role: applications
dependsOn:
- name: lab-app-logging-crds
