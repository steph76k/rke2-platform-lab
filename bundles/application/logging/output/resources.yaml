apiVersion: v1
kind: Service
metadata:
  name: opensearch-cluster-master
  namespace: cattle-logging-system
spec:
  ports:
  - name: https
    port: 9200
    targetPort: 9200
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: opensearch-cluster2
  namespace: cattle-logging-system
  labels:
    kubernetes.io/service-name: opensearch-cluster-master
    endpointslice.kubernetes.io/managed-by: fleet
addressType: IPv4
ports:
- name: https
  protocol: TCP
  port: 9200
endpoints:
- addresses:
  - 192.168.1.196
  conditions:
    ready: true
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: opensearch-cluster1
  namespace: cattle-logging-system
spec:
  opensearch:
    host: opensearch-cluster-master
    port: 9200
    scheme: https
    ssl_verify: true
    log_os_400_reason: true
    ca_file:
      mountFrom:
        secretKeyRef:
          name: platform-opensearch-logging
          key: ca.crt
    user: platform-logging
    password:
      valueFrom:
        secretKeyRef:
          name: platform-opensearch-logging
          key: password
    logstash_format: true
    logstash_prefix: kubernetes-rke2-cluster1
    buffer:
      tags: tag,time
      flush_thread_burst_interval: 0.05s
      queued_chunks_limit_size: 64
      flush_mode: interval
      flush_interval: 10s
      flush_thread_count: 2
      timekey: 1m
      timekey_wait: 30s
      timekey_use_utc: true
      retry_max_interval: 30s
      retry_forever: true
    request_timeout: 30s
    verify_os_version_at_startup: false
    default_opensearch_version: 3
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: cluster1-to-opensearch
  namespace: cattle-logging-system
spec:
  filters:
  - dedot:
      de_dot_nested: true
      de_dot_separator: _
  - record_modifier:
      records:
      - cluster_name: rke2-cluster1
        cluster_role: applications
        environment: lab
  globalOutputRefs:
  - opensearch-cluster1
