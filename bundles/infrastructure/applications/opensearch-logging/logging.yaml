apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterOutput
metadata:
  name: opensearch-root
  namespace: cattle-logging-system
spec:
  opensearch:
    host: opensearch-cluster-master.opensearch.svc.cluster.local
    port: 9200
    scheme: https
    ssl_verify: true
    log_os_400_reason: true
    ca_file:
      mountFrom:
        secretKeyRef:
          name: platform-opensearch-logging
          key: ca.crt
    user: platform-logging
    password:
      valueFrom:
        secretKeyRef:
          name: platform-opensearch-logging
          key: password
    logstash_format: true
    logstash_prefix: kubernetes
    buffer:
      timekey: 1m
      timekey_wait: 30s
      timekey_use_utc: true
      flush_at_shutdown: true
      chunk_limit_size: 2m
      flush_thread_count: 8
      flush_thread_burst_interval: 0.001s
    bulk_message_request_threshold: '2097152'
    reload_connections: false
    reload_on_failure: false
    reconnect_on_error: true
    verify_os_version_at_startup: false
    default_opensearch_version: 3
    request_timeout: 30s
---
apiVersion: logging.banzaicloud.io/v1beta1
kind: ClusterFlow
metadata:
  name: all-logs-to-opensearch-root
  namespace: cattle-logging-system
spec:
  filters:
  - dedot:
      de_dot_nested: true
      de_dot_separator: _
  globalOutputRefs:
  - opensearch-root
