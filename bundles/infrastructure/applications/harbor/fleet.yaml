name: lab-infra-harbor
defaultNamespace: harbor-ha
helm:
  releaseName: harbor
  repo: https://helm.goharbor.io
  chart: harbor
  version: 1.19.2
  valuesFiles:
  - values.yaml
  timeoutSeconds: 900
overrideTargets:
- name: lab-infrastructure
  clusterSelector:
    matchLabels:
      environment: lab
      role: infrastructure
dependsOn:
- name: lab-infra-harbor-postgres
- name: lab-infra-redis-replication
- name: lab-infra-harbor-secrets
- name: lab-infra-harbor-storage
