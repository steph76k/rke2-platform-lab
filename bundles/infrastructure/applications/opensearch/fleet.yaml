name: lab-infra-opensearch
defaultNamespace: opensearch
helm:
  releaseName: opensearch
  repo: https://opensearch-project.github.io/helm-charts/
  chart: opensearch
  version: 3.9.0
  valuesFiles:
  - values.yaml
  timeoutSeconds: 900
overrideTargets:
- name: lab-infrastructure
  clusterSelector:
    matchLabels:
      environment: lab
      role: infrastructure
dependsOn:
- name: lab-infra-opensearch-secrets
