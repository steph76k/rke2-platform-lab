apiVersion: v1
kind: Service
metadata:
  name: opensearch-cross-cluster
  namespace: opensearch
  annotations:
    lbipam.cilium.io/ips: 192.168.1.196
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  loadBalancerSourceRanges:
  - 192.168.1.23/32
  - 192.168.1.161/32
  - 192.168.1.191/32
  - 192.168.1.65/32
  - 192.168.1.42/32
  ports:
  - name: https
    port: 9200
    targetPort: 9200
  selector:
    app.kubernetes.io/instance: opensearch
    app.kubernetes.io/name: opensearch
