apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-logging
  namespace: cattle-logging-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-logging
  target:
    name: platform-opensearch-logging
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: platform/opensearch/logging
      property: username
  - secretKey: password
    remoteRef:
      key: platform/opensearch/logging
      property: password
  - secretKey: ca.crt
    remoteRef:
      key: platform/opensearch/logging
      property: ca.crt
