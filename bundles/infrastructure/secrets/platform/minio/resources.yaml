apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-minio
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-minio-tokenreviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-minio-tokenreviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-minio-tokenreviewer
subjects:
- kind: ServiceAccount
  name: openbao-minio
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-minio
spec:
  conditions:
  - namespaces:
    - minio
  provider:
    vault:
      server: https://openbao.berger.ph
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: rke2-cluster2
          role: eso-minio
          serviceAccountRef:
            name: openbao-minio
            namespace: external-secrets
            audiences:
            - https://kubernetes.default.svc.cluster.local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-minio
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
  - secretKey: root-user
    remoteRef:
      key: platform/minio/credentials
      property: root-user
  - secretKey: root-password
    remoteRef:
      key: platform/minio/credentials
      property: root-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-tls
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-minio
    kind: ClusterSecretStore
  target:
    name: minio-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: platform/minio/tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: platform/minio/tls
      property: tls.key
  - secretKey: ca.crt
    remoteRef:
      key: platform/minio/tls
      property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-registry
  namespace: minio
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-minio
    kind: ClusterSecretStore
  target:
    name: minio-registry
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
  - secretKey: .dockerconfigjson
    remoteRef:
      key: platform/minio/credentials
      property: dockerconfigjson
