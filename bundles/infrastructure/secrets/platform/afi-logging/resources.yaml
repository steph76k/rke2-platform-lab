apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-afi-logging
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-afi-logging-tokenreviewer
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-afi-logging-tokenreviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-afi-logging-tokenreviewer
subjects:
- kind: ServiceAccount
  name: openbao-afi-logging
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-afi-logging
spec:
  conditions:
  - namespaces:
    - cattle-logging-system
    - opensearch
  provider:
    vault:
      server: https://openbao.berger.ph
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: rke2-cluster2
          role: eso-afi-logging-rke2-cluster2
          serviceAccountRef:
            name: openbao-afi-logging
            namespace: external-secrets
            audiences:
            - https://kubernetes.default.svc.cluster.local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: afi-opensearch-ingest
  namespace: cattle-logging-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-afi-logging
    kind: ClusterSecretStore
  target:
    name: afi-opensearch-ingest
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
  - secretKey: username
    remoteRef:
      key: platform/afi-logging/rke2-cluster2
      property: username
  - secretKey: password
    remoteRef:
      key: platform/afi-logging/rke2-cluster2
      property: password
  - secretKey: ca.crt
    remoteRef:
      key: platform/afi-logging/rke2-cluster2
      property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: afi-opensearch-oidc
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-afi-logging
    kind: ClusterSecretStore
  target:
    name: afi-opensearch-oidc
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
  - secretKey: client_id
    remoteRef:
      key: platform/oidc/afi-opensearch
      property: client_id
  - secretKey: client_secret
    remoteRef:
      key: platform/oidc/afi-opensearch
      property: client_secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: afi-opensearch-dashboards-tls
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-afi-logging
    kind: ClusterSecretStore
  target:
    name: afi-opensearch-dashboards-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: platform/afi-logging/dashboards-tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: platform/afi-logging/dashboards-tls
      property: tls.key
  - secretKey: ca.crt
    remoteRef:
      key: platform/afi-logging/dashboards-tls
      property: ca.crt
