apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-redis
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-redis
  target:
    name: platform-redis
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: platform/redis/credentials
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-redis
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-redis
  target:
    name: platform-harbor-redis
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: platform/redis/credentials
      property: password
