apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  annotations:
    field.cattle.io/projectId: c-44q9v:p-6qghv
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-argocd
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-argocd-tokenreviewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-infra-openbao-tokenreview
subjects:
- kind: ServiceAccount
  name: openbao-argocd
  namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-argocd
spec:
  conditions:
  - namespaces:
    - argocd
  provider:
    vault:
      server: https://openbao.berger.ph
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: rke2-cluster2
          role: eso-argocd
          serviceAccountRef:
            name: openbao-argocd
            namespace: external-secrets
            audiences:
            - https://kubernetes.default.svc.cluster.local
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-argocd
    kind: ClusterSecretStore
  target:
    name: argocd-secret
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: oidc.keycloak.clientSecret
    remoteRef:
      key: platform/oidc/afi-argocd
      property: client_secret
  - secretKey: admin.password
    remoteRef:
      key: platform/argocd/admin
      property: password_hash
  - secretKey: admin.passwordMtime
    remoteRef:
      key: platform/argocd/admin
      property: password_mtime
  - secretKey: server.secretkey
    remoteRef:
      key: platform/argocd/admin
      property: server_secretkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-server-tls
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao-argocd
    kind: ClusterSecretStore
  target:
    name: argocd-server-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
  - secretKey: tls.crt
    remoteRef:
      key: platform/argocd/tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: platform/argocd/tls
      property: tls.key
