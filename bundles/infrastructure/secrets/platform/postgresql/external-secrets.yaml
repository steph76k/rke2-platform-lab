apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-postgresql
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-postgresql
  target:
    name: platform-harbor-postgresql
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/basic-auth
  data:
  - secretKey: username
    remoteRef:
      key: platform/postgresql/harbor
      property: username
  - secretKey: password
    remoteRef:
      key: platform/postgresql/harbor
      property: password
