apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-admin
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-harbor
  target:
    name: platform-harbor-admin
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: HARBOR_ADMIN_PASSWORD
    remoteRef:
      key: platform/harbor/credentials
      property: admin-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-key
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-harbor
  target:
    name: platform-harbor-key
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: secretKey
    remoteRef:
      key: platform/harbor/credentials
      property: secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
