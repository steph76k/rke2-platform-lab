apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-token-tls
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-harbor
  target:
    name: platform-harbor-token-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: platform/harbor/token-tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: platform/harbor/token-tls
      property: tls.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-harbor-ingress-tls
  namespace: harbor-ha
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-harbor
  target:
    name: platform-harbor-ingress-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: tls.crt
    remoteRef:
      key: platform/harbor/ingress-tls
      property: tls.crt
