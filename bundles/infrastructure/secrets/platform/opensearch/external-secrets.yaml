apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-admin
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-opensearch
  target:
    name: platform-opensearch-admin
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: password
    remoteRef:
      key: platform/opensearch/admin
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-dashboards
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-opensearch
  target:
    name: platform-opensearch-dashboards
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: platform/opensearch/dashboards
      property: username
  - secretKey: password
    remoteRef:
      key: platform/opensearch/dashboards
      property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-security
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-opensearch
  target:
    name: platform-opensearch-security
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: config.yml
    remoteRef:
      key: platform/opensearch/security
      property: config.yml
  - secretKey: roles.yml
    remoteRef:
      key: platform/opensearch/security
      property: roles.yml
  - secretKey: roles_mapping.yml
    remoteRef:
      key: platform/opensearch/security
      property: roles_mapping.yml
  - secretKey: action_groups.yml
    remoteRef:
      key: platform/opensearch/security
      property: action_groups.yml
  - secretKey: tenants.yml
    remoteRef:
      key: platform/opensearch/security
      property: tenants.yml
  - secretKey: nodes_dn.yml
    remoteRef:
      key: platform/opensearch/security
      property: nodes_dn.yml
  - secretKey: allowlist.yml
    remoteRef:
      key: platform/opensearch/security
      property: allowlist.yml
  - secretKey: internal_users.yml
    remoteRef:
      key: platform/opensearch/security
      property: internal_users.yml
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-tls
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-opensearch
  target:
    name: platform-opensearch-tls
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      type: kubernetes.io/tls
  data:
  - secretKey: ca.crt
    remoteRef:
      key: platform/opensearch/tls
      property: ca.crt
  - secretKey: tls.crt
    remoteRef:
      key: platform/opensearch/tls
      property: tls.crt
  - secretKey: tls.key
    remoteRef:
      key: platform/opensearch/tls
      property: tls.key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-opensearch-ca
  namespace: opensearch
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-opensearch
  target:
    name: platform-opensearch-ca
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: ca.crt
    remoteRef:
      key: platform/opensearch/tls
      property: ca.crt
