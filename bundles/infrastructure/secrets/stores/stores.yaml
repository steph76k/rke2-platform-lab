---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-infra-openbao-tokenreview
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-infra-openbao-tokenreview
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: lab-infra-openbao-tokenreview
subjects:
- kind: ServiceAccount
  name: openbao-harbor
  namespace: external-secrets
- kind: ServiceAccount
  name: openbao-postgresql
  namespace: external-secrets
- kind: ServiceAccount
  name: openbao-redis
  namespace: external-secrets
- kind: ServiceAccount
  name: openbao-opensearch
  namespace: external-secrets
- kind: ServiceAccount
  name: openbao-infrastructure
  namespace: external-secrets
