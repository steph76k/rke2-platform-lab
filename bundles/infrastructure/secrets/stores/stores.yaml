apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-harbor
  namespace: external-secrets
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-harbor
spec:
  conditions:
  - namespaces:
    - harbor-ha
  provider:
    vault:
      server: https://openbao.berger.ph
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: rke2-cluster2
          role: eso-harbor
          serviceAccountRef:
            name: openbao-harbor
            namespace: external-secrets
            audiences:
            - https://kubernetes.default.svc.cluster.local
---
