apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openbao-infrastructure-smoke
  namespace: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao-infrastructure
  target:
    name: openbao-infrastructure-smoke
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: probe
    remoteRef:
      key: platform/bootstrap/smoke
      property: probe
