    '
  hosts.toml: "# Managed by Fleet lab-infra-harbor-trust\nserver = \"https://harbor-ha.berger.ph\"\
    \n[host.\"https://harbor-ha.berger.ph\"]\n  capabilities = [\"pull\", \"resolve\"\
    ]\n  ca = \"/var/lib/rancher/rke2/agent/etc/containerd/certs.d/harbor-ha.berger.ph/lab-ca.crt\"\
    \n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: harbor-registry-trust
  namespace: minio
spec:
  selector:
    matchLabels:
      app: harbor-registry-trust
  template:
    metadata:
      labels:
        app: harbor-registry-trust
    spec:
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      containers:
      - name: install-ca
        image: busybox:1.36
        command:
        - sh
        - -c
        - "set -eu\nif [ -f /target/hosts.toml ] && ! grep -q '^# Managed by Fleet\
          \ lab-infra-harbor-trust$' /target/hosts.toml; then\n  echo 'Refusing to\
          \ overwrite existing registry configuration'; exit 1\nfi\ncp /source/lab-ca.crt\
          \ /target/lab-ca.crt\ncp /source/hosts.toml /target/hosts.toml\nchmod 0644\
          \ /target/lab-ca.crt /target/hosts.toml\necho 'Harbor CA trust installed;\
          \ no runtime restart needed'\ntouch /tmp/ready\nexec sleep infinity\n"
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            cpu: 50m
            memory: 32Mi
        readinessProbe:
          exec:
            command:
            - test
            - -f
            - /tmp/ready
        volumeMounts:
        - name: source
          mountPath: /source
          readOnly: true
        - name: target
          mountPath: /target
      volumes:
      - name: source
        configMap:
          name: harbor-registry-trust
      - name: target
        hostPath:
          path: /var/lib/rancher/rke2/agent/etc/containerd/certs.d/harbor-ha.berger.ph
          type: DirectoryOrCreate
