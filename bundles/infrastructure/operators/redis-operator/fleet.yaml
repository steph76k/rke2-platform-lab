name: lab-infra-redis-operator
defaultNamespace: harbor-ha
helm:
  releaseName: redis-operator
  repo: https://ot-container-kit.github.io/helm-charts/
  chart: redis-operator
  version: 0.27.0
  valuesFiles:
  - values.yaml
  timeoutSeconds: 900
overrideTargets:
- name: lab-infrastructure
  clusterSelector:
    matchLabels:
      environment: lab
      role: infrastructure
