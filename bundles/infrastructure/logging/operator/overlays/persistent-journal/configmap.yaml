apiVersion: v1
kind: ConfigMap
metadata:
  name: rancher-logging-rke2
  namespace: cattle-logging-system
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush             1
        Grace             5
        Daemon            Off
        Log_Level         info
        Coro_Stack_Size   24576
        Parsers_File      parsers.conf
        storage.path /buffers/queue
        storage.sync full
        storage.checksum on
        storage.max_chunks_up 32
        storage.backlog.mem_limit 32M
        storage.metrics on
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020

    [INPUT]
        Name              systemd
        DB /buffers/systemd.db
        DB.Sync Full
        storage.type filesystem
        Tag               rke2_journald
        Path              /run/log/journal
        Systemd_Filter    _SYSTEMD_UNIT=rke2-server.service
        Systemd_Filter    _SYSTEMD_UNIT=rke2-agent.service

    [INPUT]
        Name              tail
        DB /buffers/kubelet.db
        DB.Sync Full
        storage.type filesystem
        Mem_Buf_Limit 32M
        Read_From_Head On
        Tag               rke2_kubelet
        Path              /var/lib/rancher/rke2/agent/logs/kubelet.log

    [FILTER]
        Name              parser
        Match             rke2_kubelet
        Key_Name          log
        Parser            klog
        Reserve_Data      On

    [FILTER]
        Name              parser
        Match             rke2_journald
        Key_Name          MESSAGE
        Parser            klog
        Reserve_Data      On

    [FILTER]
        Name              parser
        Match             rke2_journald
        Key_Name          MESSAGE
        Parser            rancher
        Reserve_Data      On

    [FILTER]
        Name              parser
        Match             rke2_journald
        Key_Name          MESSAGE
        Parser            etcd
        Reserve_Data      On

    [FILTER]
        Name              record_modifier
        Match             *
        Record            node ${NODE_NAME}

    [OUTPUT]
        Name              forward
        Match             *
        Host              rancher-logging-root-fluentd.cattle-logging-system.svc
        Port              24240
        Retry_Limit       False
        Require_ack_response True
        storage.total_limit_size 2G
