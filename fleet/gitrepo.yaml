# Apply on the Rancher/Fleet management cluster, not on the downstream cluster.
# Replace YOUR_GITHUB_ACCOUNT and the cluster selector with your actual Fleet labels.
apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: rke2-platform-poc
  namespace: fleet-default
spec:
  repo: https://github.com/steph76k/rke2-platform-lab.git
  branch: main
  paths:
    - bundles/00-bootstrap-test
  targets:
    - name: rke2-cluster2
      clusterSelector:
        matchLabels:
          platform-role: infrastructure-poc
