apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: rke2-platform
  namespace: fleet-default
spec:
  repo: https://github.com/steph76k/rke2-platform-lab.git
  branch: main
  paths:
    - bundles/00-bootstrap-test
    - bundles/application/operators/external-secrets
  targets:
    - name: lab-infrastructure
      clusterSelector:
        matchLabels:
          environment: lab
          role: infrastructure
    - name: lab-applications
      clusterSelector:
        matchLabels:
          environment: lab
          role: applications
