apiVersion: fleet.cattle.io/v1alpha1
kind: GitRepo
metadata:
  name: rke2-platform
  namespace: fleet-default
spec:
  repo: https://github.com/steph76k/rke2-platform-lab.git
  branch: main
  paths:
  - bundles/00-bootstrap-test
  - bundles/application/operators/external-secrets
  - bundles/infrastructure/operators/external-secrets
  - bundles/infrastructure/secrets/stores
  - bundles/infrastructure/secrets/smoke-test
  - bundles/infrastructure/secrets/platform/harbor
  - bundles/infrastructure/secrets/platform/postgresql
  - bundles/infrastructure/secrets/platform/redis
  - bundles/infrastructure/secrets/platform/opensearch
  - bundles/infrastructure/secrets/platform/logging
  - bundles/infrastructure/operators/cnpg
  - bundles/infrastructure/operators/redis-operator
  - bundles/infrastructure/data-services/storage-class
  - bundles/infrastructure/data-services/harbor-postgres
  - bundles/infrastructure/data-services/redis-replication
  - bundles/infrastructure/data-services/harbor-storage
  - bundles/infrastructure/applications/opensearch
  - bundles/infrastructure/applications/harbor
  - bundles/infrastructure/applications/opensearch-dashboards
  - bundles/infrastructure/applications/opensearch-ingest
  - bundles/application/logging/crds
  - bundles/application/logging/secrets
  - bundles/application/logging/operator
  - bundles/application/logging/output
  - bundles/infrastructure/secrets/platform/minio
  - bundles/infrastructure/bootstrap/harbor-trust
  - bundles/infrastructure/applications/minio
  - bundles/application/logging/afi-secrets
  - bundles/infrastructure/secrets/platform/afi-logging
  - bundles/application/logging/monitoring
  - bundles/infrastructure/observability/logging-monitoring
  - bundles/infrastructure/logging/crds
  - bundles/infrastructure/logging/operator
  - bundles/infrastructure/security/project-labels
  - bundles/infrastructure/observability/monitoring-crds
  - bundles/infrastructure/observability/monitoring
  - bundles/infrastructure/observability/monitoring-logging
  - bundles/infrastructure/secrets/platform/argocd
  - bundles/infrastructure/applications/argocd
  - bundles/infrastructure/applications/argocd-policy
  - bundles/management/navigation
  targets:
  - name: lab-infrastructure
    clusterSelector:
      matchLabels:
        environment: lab
        role: infrastructure
  - name: lab-applications
    clusterSelector:
      matchLabels:
        environment: lab
        role: applications
