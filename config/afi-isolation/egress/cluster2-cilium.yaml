apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-cilium
  namespace: kube-system
spec:
  failurePolicy: reinstall
  valuesContent: |
    kubeProxyReplacement: true
    k8sServiceHost: 192.168.1.164
    k8sServicePort: 6443
    bpf:
      masquerade: true
      preallocateMaps: true
      tproxy: true
    bpfClockProbe: true
    nodePort:
      enabled: true
    gatewayAPI:
      enabled: true
    ingressController:
      enabled: true
      loadbalancerMode: shared
    envoy:
      enabled: true
    l2announcements:
      enabled: true
    ipam:
      mode: cluster-pool
    hubble:
      enabled: true
      relay:
        enabled: true
    egressGateway:
      enabled: true
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
